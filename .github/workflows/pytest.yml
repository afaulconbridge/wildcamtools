on:
  push:

name: "PyTest"
permissions: {}

jobs:
  uv-example:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install projects and dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run pytest ./tests
