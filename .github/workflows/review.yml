name: Code Review

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Ensures we have the full history for diff

      - name: Get diff
        # this will only work for non-fork PRs
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git diff origin/"$BASE_REF"..origin/"$HEAD_REF" > diff.txt

      - name: Install OpenCode
        run: |
          curl -fsSL -o install.sh https://opencode.ai/install
          echo "fc3c1b2123f49b6df545a7622e5127d21cd794b15134fc3b66e1ca49f7fb297e  install.sh" | sha256sum -c -
          bash install.sh

      - name: Setup Ollama Cloud auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{"ollama-cloud":{"type":"api","key":"${{ secrets.OLLAMA_CLOUD_API_KEY }}"}}' > ~/.local/share/opencode/auth.json

      - name: Run AI Review
        env:
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
        run: |
          opencode models --provider ollama-cloud
          OUTPUT=$(opencode run --model 'ollama-cloud/gemma4:31b' --agent code-reviewer "This is a diff of changes in this pull request compared to the target main branch, review it." --file diff.txt) || {
            echo "OpenCode failed to execute."
            exit 1
          }
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "^[^a-zA-Z0-9]*STATUS[[:space:]]*:[[:space:]]*FAIL"; then
            echo "Review failed due to severe issues."
            exit 1
          fi
          if echo "$OUTPUT" | grep -q "^[^a-zA-Z0-9]*STATUS[[:space:]]*:[[:space:]]*PASS"; then
            echo "Review passed."
            exit 0
          fi
          echo "Review unclear."
          exit 1
