name: Code Review

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenCode
        run: |
          curl -fsSL -o install.sh https://opencode.ai/install
          echo "fc3c1b2123f49b6df545a7622e5127d21cd794b15134fc3b66e1ca49f7fb297e  install.sh" | sha256sum -c -
          bash install.sh

      - name: Run AI Review
        env:
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
        run: |
          OUTPUT=$(opencode run --agent code-reviewer 'Review the changes in the current branch compared to the main branch.') || {
            echo "OpenCode failed to execute."
            exit 1
          }
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "^[^a-zA-Z0-9]*STATUS[[:space:]]*:[[:space:]]*FAIL"; then
            echo "Review failed due to severe issues."
            exit 1
          fi
          if echo "$OUTPUT" | grep -q "^[^a-zA-Z0-9]*STATUS[[:space:]]*:[[:space:]]*PASS"; then
            echo "Review passed."
            exit 0
          fi
          echo "Review unclear."
          exit 1
