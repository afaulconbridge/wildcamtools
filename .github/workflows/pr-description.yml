name: Generate PR Description

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-description:
    runs-on: ubuntu-latest
    if: github.event.pull_request.body == ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Ensures we have the full history for diff

      - name: Get diff
        # this will only work for non-fork PRs
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git diff origin/"$BASE_REF"..origin/"$HEAD_REF" > diff.txt

      - name: Install OpenCode
        run: |
          curl -fsSL -o install.sh https://opencode.ai/install
          echo "fc3c1b2123f49b6df545a7622e5127d21cd794b15134fc3b66e1ca49f7fb297e  install.sh" | sha256sum -c -
          bash install.sh

      - name: Setup Ollama Cloud auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{"ollama-cloud":{"type":"api","key":"${{ secrets.OLLAMA_CLOUD_API_KEY }}"}}' > ~/.local/share/opencode/auth.json

      - name: Generate PR Description
        env:
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          opencode models --provider ollama-cloud
          OUTPUT=$(opencode run --model 'ollama-cloud/gemma4:31b' --agent documenter "Write a pull request description based on this diff. Follow the structure in .github/pull_request_template.md" --file diff.txt) || {
            echo "OpenCode failed to execute."
            exit 1
          }
          echo "$OUTPUT"

          # Update the PR description
          gh pr edit "$PR_NUMBER" --body "$OUTPUT" || {
            echo "Failed to update PR description."
            exit 1
          }
