[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "builtin"
hooks = [{ id = "pretty-format-json", args = ["--autofix", "--no-sort-keys"] }]

[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "v0.9.3"
hooks = [{ id = "taplo-format" }]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-prettier"
rev = "v3.1.0"
hooks = [{ id = "prettier", types = ["yaml"] }]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.11.6"
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [{ id = "shellcheck" }]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "local"
hooks = [
  { id = "ruff-format", name = "ruff format", language = "system", files = "\\.py$", entry = "uv run ruff format" },
  { id = "ruff-check", name = "ruff check", language = "system", files = "\\.py$", entry = "uv run ruff check" },
  # run via a shell wrapper to inject additional arguments in CI to avoid flakey caching
  { id = "mypy", name = "mypy", language = "system", files = "^src/.*\\.py$", entry = "sh -c \"uv run mypy ${PREK_MYPY_FLAGS}\"" },
]
